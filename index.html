<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRenterRoom | Curated Interior Essentials</title>
    <style>
        :root {
            --bg-color: #FAF9F6;       /* Base (Warm Off-White) */
            --primary-accent: #C28E5C;  /* Primary Accent (Terracotta / Warm Oak) */
            --secondary-accent: #7B8F6C;/* Secondary Accent (Muted Sage Green) */
            --text-main: #2B2F2A;       /* Text/Contrast (Deep Charcoal) */
            --card-bg: #FFFFFF;         /* Pure white contrast for cards */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Master container layout framework */
        .wrapper {
            width: 100%;
            max-width: 600px; /* Locked down exactly to match your crisp mobile screenshots */
            display: flex;
            flex-direction: column;
        }

        /* Techiela Profile Panel Elements */
        header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 30px;
            margin-bottom: 25px;
            width: 100%;
        }
        
        .brand-avatar {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; font-size: 1.8rem; font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 6px 15px rgba(194, 142, 92, 0.15);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            text-align: left;
        }
        header p {
            font-size: 0.95rem;
            opacity: 0.65;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: left;
        }

        /* High-Contrast SVG Social Row Links precisely layout configured */
        .social-row {
            display: flex; gap: 20px; margin-bottom: 10px;
        }
        .social-link-item {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        .social-link-item svg {
            width: 20px; height: 20px;
            fill: var(--text-main);
            opacity: 0.8;
            transition: fill 0.2s ease, opacity 0.2s ease;
        }
        .social-link-item:hover { transform: translateY(-2px); }
        .social-link-item:hover svg { fill: var(--primary-accent); opacity: 1; }

        /* Real-Time Live Search Engine Input Area */
        .search-container {
            position: relative;
            margin-top: 20px;
            margin-bottom: 16px;
            width: 100%;
        }
        .search-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 24px;
            border: 1px solid rgba(43, 47, 42, 0.08);
            background-color: rgba(43, 47, 42, 0.03);
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            background-color: #FFFFFF;
            border-color: var(--primary-accent);
            box-shadow: 0 4px 12px rgba(194, 142, 92, 0.05);
        }
        .search-icon-svg {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            width: 16px; height: 16px;
            fill: var(--text-main); opacity: 0.3;
            pointer-events: none;
        }

        /* Dynamic Visual Categories Filters Horizontal Menu Scroll */
        .category-scroll-box {
            display: flex; gap: 8px; overflow-x: auto; width: 100%;
            padding-bottom: 8px; margin-bottom: 30px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .category-scroll-box::-webkit-scrollbar { display: none; }
        
        .filter-pill {
            background-color: #FFFFFF; border: 1px solid rgba(43, 47, 42, 0.08);
            color: var(--text-main); padding: 8px 18px; border-radius: 20px;
            font-weight: 500; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.88rem; whitespace: nowrap; flex-shrink: 0;
        }
        .filter-pill.active, .filter-pill:hover {
            background-color: #000000; color: #FFFFFF; border-color: #000000;
        }

        /* Techiela Subheader Headers Meta Counter line */
        .feed-meta-row {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(43, 47, 42, 0.06);
            padding-bottom: 10px; margin-bottom: 20px;
            font-size: 0.72rem; letter-spacing: 0.8px; font-weight: 700;
            text-transform: uppercase; color: var(--text-main); opacity: 0.35;
        }

        /* Exact 2-Column Responsive Product Display Feed Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            margin-bottom: 50px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(43, 47, 42, 0.04);
            display: flex; flex-direction: column;
            position: relative;
            transition: transform 0.2s ease;
        }
        .product-card.hidden { display: none !important; }

        /* Category metadata mini label floating on product image block */
        .category-floating-tag {
            position: absolute; top: 10px; left: 10px; z-index: 2;
            background-color: rgba(255, 255, 255, 0.94);
            padding: 3px 8px; border-radius: 6px; font-size: 0.65rem;
            font-weight: 600; opacity: 0.5; color: var(--text-main);
        }

        .image-aspect-frame {
            width: 100%; padding-top: 100%; position: relative;
            background-color: #F4F3EE;
        }
        .product-photo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .product-details { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .product-title-text { 
            font-size: 0.92rem; font-weight: 500; line-height: 1.35; 
            margin-bottom: 8px; text-align: left; opacity: 0.95;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            height: 38px;
        }
        
        .price-row-text { 
            font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; 
            display: flex; align-items: center; gap: 4px; text-align: left;
        }
        .badge-vendor { font-weight: 400; opacity: 0.4; font-size: 0.78rem; }

        .btn-redirect {
            background-color: #000000; color: #FFFFFF;
            text-decoration: none; text-align: center; padding: 10px;
            border-radius: 18px; font-weight: 600; font-size: 0.82rem; margin-top: auto;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        /* Techiela Legal Platform Footer style */
        footer {
            width: 100%; border-top: 1px solid rgba(43, 47, 42, 0.06);
            padding-top: 24px; padding-bottom: 40px; font-size: 0.8rem;
            opacity: 0.5; line-height: 1.5; text-align: left;
        }
        .disclosure-paragraph { margin-bottom: 20px; font-weight: 400; }
        .meta-copyright-line { display: flex; justify-content: space-between; font-weight: 500; }
    </style>
</head>
<body>
