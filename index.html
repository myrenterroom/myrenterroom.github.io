<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRenterRoom | Curated Interior Essentials</title>
    <style>
        :root {
            --bg-color: #FAF9F6;       /* Warm Off-White (Base) */
            --primary-accent: #C28E5C;  /* Terracotta / Warm Oak */
            --secondary-accent: #7B8F6C;/* Muted Sage Green */
            --text-main: #2B2F2A;       /* Deep Charcoal */
            --card-bg: #FFFFFF;         /* Crisp White Contrast */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Techiela Premium Layout Container Split Frame */
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-top: 30px;
        }

        @media (min-width: 900px) {
            .container {
                flex-direction: row;
                align-items: flex-start;
                gap: 60px;
            }
            header {
                position: sticky;
                top: 40px;
                width: 35%;
                text-align: left !important;
            }
            .content-section {
                width: 65%;
            }
        }

        @media (max-width: 899px) {
            header {
                text-align: center;
                margin-bottom: 10px;
            }
            .content-section {
                width: 100%;
            }
        }

        /* Left Side Profile Branding Panel */
        .brand-logo-placeholder {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; font-size: 1.8rem; font-weight: bold;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(194, 142, 92, 0.15);
        }
        @media (max-width: 899px) { .brand-logo-placeholder { margin: 0 auto 24px auto; } }

        header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin-bottom: 14px;
        }
        header p {
            font-size: 1.05rem;
            opacity: 0.75;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* High-Definition SVG Social Brand Row Links */
        .social-links {
            display: flex; gap: 14px; margin-bottom: 30px;
        }
        @media (max-width: 899px) { .social-links { justify-content: center; } }
        
        .social-icon {
            width: 44px; height: 44px;
            border: 1px solid rgba(43, 47, 42, 0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s ease;
            background-color: #FFFFFF;
        }
        .social-icon svg {
            width: 18px; height: 18px;
            fill: var(--text-main);
            transition: fill 0.25s ease;
            display: block;
        }
        .social-icon:hover {
            border-color: var(--primary-accent);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(194, 142, 92, 0.1);
        }
        .social-icon:hover svg {
            fill: var(--primary-accent);
        }

        /* Right Side Content Section Elements */
        .search-wrapper {
            position: relative;
            margin-bottom: 30px;
            width: 100%;
        }
        .search-bar {
            width: 100%;
            padding: 16px 20px 16px 48px;
            border-radius: 30px;
            border: 1px solid rgba(43, 47, 42, 0.12);
            background-color: #FFFFFF;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(43, 47, 42, 0.02);
        }
        .search-bar:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 4px 16px rgba(194, 142, 92, 0.08);
        }
        .search-icon {
            position: absolute; left: 20px; top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Filter Pills Styling */
        .category-menu {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 35px;
        }
        .filter-btn {
            background-color: #FFFFFF; border: 1px solid rgba(43, 47, 42, 0.08);
            color: var(--text-main); padding: 9px 20px; border-radius: 20px;
            font-weight: 600; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.85rem; letter-spacing: 0.3px;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: #2B2F2A; color: #FAF9F6;
            border-color: #2B2F2A;
        }

        .feed-heading-meta {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(43, 47, 42, 0.08);
            padding-bottom: 12px; margin-bottom: 30px;
            font-size: 0.78rem; letter-spacing: 1px; font-weight: 700;
            text-transform: uppercase; opacity: 0.5;
        }

        /* Product Catalog Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(43, 47, 42, 0.02);
            border: 1px solid rgba(43, 47, 42, 0.05);
            display: flex; flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 0.3s ease;
            position: relative;
        }
        .product-card.hidden { display: none !important; }
        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary-accent);
            box-shadow: 0 12px 30px rgba(43, 47, 42, 0.06);
        }

        .card-tag-badge {
            position: absolute; top: 16px; left: 16px; z-index: 2;
            background-color: rgba(255, 255, 255, 0.96);
            padding: 5px 12px; border-radius: 20px; font-size: 0.72rem;
            font-weight: 700; border: 1px solid rgba(43, 47, 42, 0.06);
            letter-spacing: 0.2px;
        }

        .image-container {
            width: 100%; padding-top: 100%; position: relative;
            background-color: #F4F3EE;
            overflow: hidden;
        }
        .product-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transition: transform 0.5s ease;
        }
        .product-card:hover .product-image {
            transform: scale(1.04);
        }

        .product-info { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin-bottom: 8px; text-align: left; }
        
        .price-line {
            font-size: 1.05rem; font-weight: 700; margin-bottom: 22px;
            display: flex; align-items: center; gap: 6px;
        }
        .store-indicator { font-weight: 400; opacity: 0.5; font-size: 0.85rem; }

        .buy-btn {
            background-color: #2B2F2A; color: #FAF9F6;
            text-decoration: none; text-align: center; padding: 14px;
            border-radius: 30px; font-weight: 600; font-size: 0.9rem;
            margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.2s ease;
        }
        .buy-btn:hover { background-color: var(--primary-accent); color: var(--bg-color); }

        /* Professional Legal Footer Area */
        footer {
            margin-top: 90px; width: 100%;
            border-top: 1px solid rgba(43, 47, 42, 0.08);
            padding-top: 32px; padding-bottom: 50px;
            display: flex; flex-direction: column; gap: 24px;
            font-size: 0.85rem; opacity: 0.6; line-height: 1.6;
        }
        .footer-disclosure { max-width: 760px; font-style: italic; }
        .footer-copyright-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 8px; font-weight: 600; letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LEFT PANEL: Header Profile Info & Branded Handles -->
        <header>
            <div class="brand-logo-placeholder">M</div>
            <h1>My Renter Room</h1>
            <p>Elevating rental spaces with high-end, damage-free interior finds. Recommended furniture, decor, and upgrades all in one place.</p>
            
            <div class="social-links">
                <!-- Instagram Profile Link -->
                <a href="https://instagram.com" target="_blank" class="social-icon" title="Instagram">
