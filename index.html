<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRenterRoom | Curated Interior Essentials</title>
    <style>
        :root {
            --bg-color: #FAF9F6;       /* Warm Off-White */
            --primary-accent: #C28E5C;  /* Terracotta / Warm Oak */
            --secondary-accent: #7B8F6C;/* Muted Sage Green */
            --text-main: #2B2F2A;       /* Deep Charcoal */
            --card-bg: #FFFFFF;         /* White Contrast */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Safe, flat main container layout frame */
        .main-wrapper {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Branding Section */
        .logo-box {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; font-size: 2rem; font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(194, 142, 92, 0.15);
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 1.05rem;
            opacity: 0.75;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: center;
            max-width: 500px;
        }

        /* Flawless SVG Social Platform Link Rows */
        .social-row {
            display: flex; gap: 16px; margin-bottom: 40px; justify-content: center;
        }
        
        .icon-btn {
            width: 46px; height: 46px;
            border: 1px solid rgba(43, 47, 42, 0.18);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            background-color: #FFFFFF;
            transition: all 0.2s ease;
        }
        .icon-btn svg {
            width: 20px; height: 20px;
            fill: var(--text-main);
            display: block;
        }
        .icon-btn:hover {
            border-color: var(--primary-accent);
            transform: translateY(-3px);
        }
        .icon-btn:hover svg {
            fill: var(--primary-accent);
        }

        /* Live Search Block Engine */
        .search-container {
            position: relative;
            margin-bottom: 25px;
            width: 100%;
        }
        .search-input-field {
            width: 100%;
            padding: 16px 20px 16px 45px;
            border-radius: 30px;
            border: 1px solid rgba(43, 47, 42, 0.15);
            background-color: #FFFFFF;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease;
        }
        .search-input-field:focus {
            border-color: var(--primary-accent);
        }
        .search-lens {
            position: absolute; left: 18px; top: 50%;
            transform: translateY(-50%);
            font-size: 1rem; opacity: 0.4;
        }

        /* Custom Categories Sorting Menu */
        .filter-menu-bar {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 35px; width: 100%;
        }
        .pill-btn {
            background-color: #FFFFFF; border: 1px solid rgba(43, 47, 42, 0.08);
            color: var(--text-main); padding: 8px 18px; border-radius: 20px;
            font-weight: 600; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.88rem;
        }
        .pill-btn.active, .pill-btn:hover {
            background-color: #2B2F2A; color: #FAF9F6; border-color: #2B2F2A;
        }

        /* Product Catalog Grid Setup */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            margin-bottom: 60px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 14px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(43, 47, 42, 0.02);
            border: 1px solid rgba(43, 47, 42, 0.06);
            display: flex; flex-direction: column;
            position: relative;
            transition: transform 0.25s ease;
        }
        .item-card.hidden { display: none !important; }
        .item-card:hover { transform: translateY(-4px); }

        .tag-badge {
            position: absolute; top: 12px; left: 12px; z-index: 2;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 4px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 700;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .img-box {
            width: 100%; padding-top: 100%; position: relative; background-color: #F4F3EE;
        }
        .img-box img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }

        .info-box { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .info-box h3 { font-size: 1.1rem; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
        
        .price-tag { font-size: 1rem; font-weight: 700; margin-bottom: 18px; }
        .store-lbl { font-weight: 400; opacity: 0.5; font-size: 0.85rem; }

        .action-link {
            background-color: #2B2F2A; color: #FAF9F6;
            text-decoration: none; text-align: center; padding: 12px;
            border-radius: 25px; font-weight: 600; font-size: 0.9rem; margin-top: auto;
        }
        .action-link:hover { opacity: 0.9; }

        /* Legal Footer Details */
        footer {
            width: 100%; border-top: 1px solid rgba(43, 47, 42, 0.08);
            padding-top: 25px; padding-bottom: 40px; font-size: 0.82rem; opacity: 0.6; line-height: 1.6;
        }
        .disclaimer { margin-bottom: 15px; }
        .copyright-line { display: flex; justify-content: space-between; font-weight: 600; }
    </style>
</head>

        </div>

        <!-- REAL-TIME LIVE SEARCH FIELD ENGINE -->

        </div>

        <!-- CORE ACTIVE CATEGORY BUTTONS PILLS MENU -->
        <div class="filter-menu-bar" id="categoryMenu">
            <button class="pill-btn active" id="btn-all" onclick="filterCategory('all')">All</button>
        </div>

        <!-- PRODUCT INVENTORY CATALOG FEED -->
        <div class="products-grid" id="productsGrid">
